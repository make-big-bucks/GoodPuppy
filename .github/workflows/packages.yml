name: Desktop Packages

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            script: build:mac
            artifact: GoodPuppy-macOS
          - os: windows-latest
            script: build:windows
            artifact: GoodPuppy-Windows-x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - run: rustup update stable --no-self-update
      - run: npm ci
      - run: npm run test
      - run: npm run ${{ matrix.script }}
      - name: Verify macOS bundle
        if: runner.os == 'macOS'
        run: |
          codesign --verify --deep --strict --verbose=2 src-tauri/target/release/bundle/macos/GoodPuppy.app
          hdiutil verify src-tauri/target/release/bundle/dmg/*.dmg
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            src-tauri/target/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*-setup.exe
          if-no-files-found: error
          retention-days: 14
