<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GoodPuppy - 会客厅</title>
  <link rel="stylesheet" href="/src/windows/lounge/lounge.css" />
</head>

<body>
  <div class="win-titlebar">
    <div class="win-titlebar-drag"></div>
    <button class="win-ctrl-btn win-minimize-btn" type="button" aria-label="最小化">
      <svg width="11" height="1" viewBox="0 0 11 1" fill="none" aria-hidden="true">
        <line x1="0" y1="0.5" x2="11" y2="0.5" stroke="currentColor" stroke-width="1.2"/>
      </svg>
    </button>
    <button class="win-ctrl-btn win-maximize-btn" type="button" aria-label="最大化">
      <svg width="10" height="10" viewBox="0 0 10 10" fill="none" aria-hidden="true">
        <rect x="0.6" y="0.6" width="8.8" height="8.8" stroke="currentColor" stroke-width="1.2"/>
      </svg>
    </button>
    <button class="win-ctrl-btn win-close-btn" type="button" aria-label="关闭">
      <svg width="10" height="10" viewBox="0 0 10 10" fill="none" aria-hidden="true">
        <path d="M1 1l8 8M9 1L1 9" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
      </svg>
    </button>
  </div>
  <main class="app-window lounge-panel">
    <section class="layout">
      <aside class="sidebar">
        <div class="sidebar-drag-region"></div>
        <section class="profile-section">
          <div class="lounge-profile-card"></div>
          <button class="icon-btn lounge-settings-btn" type="button" aria-label="设置">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></svg>
        </button>
        </section>

        <div class="sidebar-head">
          <div class="sidebar-title">我的房间</div>
        </div>

        <div class="room-list lounge-room-list"></div>
        <div class="invite-list lounge-request-list"></div>

        <div class="sidebar-actions">
          <button class="btn btn-primary lounge-create-room" type="button">＋ 创建房间</button>
        </div>
      </aside>

      <section class="main">
        <div class="resize-handle" aria-hidden="true"></div>
        <div class="main-drag-region" aria-hidden="true"></div>
        <div class="empty-state lounge-empty-detail">选择一个房间查看成员</div>

        <section class="room-detail lounge-room-detail" hidden>
          <section class="room-hero">
            <div>
              <h1 class="room-title lounge-room-title"></h1>
              <p class="room-description lounge-room-description"></p>
            </div>
            <button class="icon-btn lounge-edit-room" type="button" aria-label="编辑房间信息">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.12 2.12 0 0 1 3 3L12 15l-4 1 1-4Z"/></svg>
            </button>
          </section>

          <section class="section member-section">
            <div class="section-heading">
              <h2 class="section-title">房间成员</h2>
              <div class="section-heading-actions">
                <button class="icon-btn lounge-view-history" type="button" aria-label="聊天记录" title="聊天记录">
                  <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
                </button>
                <button class="icon-btn lounge-invite-member" type="button" aria-label="邀请成员" title="邀请成员">
                  <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><line x1="19" y1="8" x2="19" y2="14"/><line x1="22" y1="11" x2="16" y2="11"/></svg>
                </button>
              </div>
            </div>
            <div class="members lounge-member-list"></div>
          </section>

          <p class="lounge-message" role="status"></p>

          <div class="actions">
            <button class="lounge-leave-room-permanent" type="button">永久退出房间</button>
            <button class="btn btn-primary lounge-enter-room" type="button">
              <svg class="svg-icon" viewBox="0 0 24 24" fill="none">
                <path d="M10 17l5-5-5-5" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
                <path d="M15 12H3" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/>
                <path d="M13 4h5a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2h-5" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/>
              </svg>
              <span class="lounge-enter-label">进入房间</span>
            </button>
          </div>
        </section>
      </section>
    </section>

    <section class="settings-view" hidden></section>
  </main>

  <div class="modal-backdrop lounge-modal-backdrop" hidden>
    <form class="lounge-modal">
      <h2 class="modal-title lounge-modal-title"></h2>
      <input class="lounge-input" name="modal-value" autocomplete="off" />
      <p class="lounge-form-message" role="status"></p>
      <div class="lounge-form-actions">
        <button class="small-btn lounge-form-cancel" type="button">取消</button>
        <button class="small-btn primary lounge-form-submit" type="submit">确定</button>
      </div>
    </form>
  </div>

  <div class="showcase-backdrop" hidden>
    <div class="showcase-panel">
      <img class="showcase-gif" alt="动画预览" />
      <div class="showcase-states"></div>
      <div class="showcase-skins"></div>
    </div>
  </div>

  <script type="module" src="/src/windows/lounge/lounge-main.ts"></script>
</body>
</html>
