<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Good Puppy</title>
  </head>
  <body>
    <main class="pet-stage is-initializing" aria-label="Good Puppy desktop pet">
      <section class="dog-area" data-user="self" aria-label="My puppy">
        <div class="bubble-stack" role="log" aria-live="polite" aria-label="Messages" data-user="self" hidden></div>
        <form class="compose-stick" data-user="self" hidden>
          <textarea class="compose-input" aria-label="Message text" rows="1"></textarea>
          <div class="compose-actions">
            <button class="compose-button compose-cancel" type="button" aria-label="Cancel">&times;</button>
            <button class="compose-button compose-send" type="submit" aria-label="Send">&#10003;</button>
          </div>
          <div class="compose-status" role="status"></div>
        </form>
        <img class="pet-image" data-user="self" src="/pets/shiba/idle.gif" alt="My puppy" draggable="false" />
      </section>
    </main>

    <script type="module" src="/src/windows/pet/main.ts"></script>
  </body>
</html>
