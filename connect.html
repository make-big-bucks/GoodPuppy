<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GoodPuppy - 连接管理</title>
  <link rel="stylesheet" href="./src/windows/connect/connect.css" />
</head>

<body>
  <main class="app-window connect-panel">
    <header class="topbar">
      <div class="page-title"> </div>

      <div class="user-card">
        <div class="avatar" aria-hidden="true">
          <svg viewBox="0 0 64 64" fill="none">
            <path d="M18 47V31C18 20 26 13 37 13C48 13 55 21 55 32C55 41 49 47 39 47H31" stroke="currentColor" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M18 31C12 33 9 38 9 47" stroke="currentColor" stroke-width="5" stroke-linecap="round"/>
            <path d="M38 47V54" stroke="currentColor" stroke-width="5" stroke-linecap="round"/>
            <circle cx="43" cy="28" r="3" fill="currentColor"/>
          </svg>
        </div>
        <div>
          <div class="user-name connect-display-name">GoodPuppy</div>
          <div class="user-id">ID: <span class="connect-gp-id"></span></div>
        </div>
      </div>

      <button class="copy-id connect-copy-btn" type="button" data-copy="gp-id">
        <svg class="svg-icon" viewBox="0 0 24 24" fill="none">
          <rect x="9" y="9" width="10" height="10" rx="2" stroke="currentColor" stroke-width="2"/>
          <rect x="5" y="5" width="10" height="10" rx="2" stroke="currentColor" stroke-width="2"/>
        </svg>
        复制
      </button>
    </header>

    <section class="layout">
      <aside class="sidebar">
        <div class="sidebar-head">
          <div class="sidebar-title">我的房间</div>
        </div>

        <div class="room-list connect-room-list"></div>
        <div class="invite-list connect-request-list"></div>

        <div class="sidebar-actions">
          <button class="btn btn-primary connect-create-room" type="button">＋ 创建房间</button>
          <button class="btn btn-secondary connect-join-room" type="button">＋ 加入房间</button>
        </div>
      </aside>

      <section class="main">
        <div class="empty-state connect-empty-detail">选择一个房间查看成员</div>

        <section class="room-detail connect-room-detail" hidden>
          <span class="connect-invite-code" hidden></span>

          <section class="section member-section">
            <h2 class="section-title">房间成员</h2>
            <div class="members connect-member-list"></div>
          </section>

          <section class="section">
            <h2 class="section-title">房间简介</h2>
            <p class="description">
              这是一个温馨的小房间，欢迎朋友们加入一起陪伴彼此的桌面时光。
              在这里，大家可以把自己的桌面形象放到同一个房间中，保持一种轻松、自然的在线陪伴感。
            </p>
          </section>

          <p class="connect-message" role="status"></p>

          <div class="actions">
            <button class="btn btn-primary connect-enter-room" type="button">
              <svg class="svg-icon" viewBox="0 0 24 24" fill="none">
                <path d="M10 17l5-5-5-5" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
                <path d="M15 12H3" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/>
                <path d="M13 4h5a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2h-5" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/>
              </svg>
              进入房间
            </button>

            <button class="btn btn-secondary connect-copy-btn" type="button" data-copy="invite-code">
              <svg class="svg-icon" viewBox="0 0 24 24" fill="none">
                <path d="M10.5 13.5 13.5 10.5" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/>
                <path d="M8.8 16.9 7.6 18.1a4 4 0 0 1-5.7-5.7l3.2-3.2a4 4 0 0 1 5.7 0" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/>
                <path d="M15.2 7.1 16.4 5.9a4 4 0 0 1 5.7 5.7l-3.2 3.2a4 4 0 0 1-5.7 0" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/>
              </svg>
              复制邀请码
            </button>

            <button class="btn btn-secondary connect-invite-member" type="button">
              <svg class="svg-icon" viewBox="0 0 24 24" fill="none">
                <path d="M15 19a6 6 0 0 0-12 0" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/>
                <circle cx="9" cy="8" r="4" stroke="currentColor" stroke-width="2.2"/>
                <path d="M19 8v6" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/>
                <path d="M16 11h6" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/>
              </svg>
              邀请成员
            </button>
          </div>
        </section>
      </section>
    </section>
  </main>

  <div class="modal-backdrop connect-modal-backdrop" hidden>
    <form class="connect-modal">
      <h2 class="modal-title connect-modal-title"></h2>
      <input class="connect-input" name="modal-value" autocomplete="off" />
      <p class="connect-form-message" role="status"></p>
      <div class="connect-form-actions">
        <button class="small-btn connect-form-cancel" type="button">取消</button>
        <button class="small-btn primary connect-form-submit" type="submit">确定</button>
      </div>
    </form>
  </div>

  <script type="module" src="/src/windows/connect/connect-main.js"></script>
</body>
</html>
