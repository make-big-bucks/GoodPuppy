<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GoodPuppy - 连接管理</title>
  <style>
    :root {
      --bg: #f4f4f2;
      --window: #ffffff;
      --panel: #fbfbfa;
      --text: #1f1f1f;
      --muted: #858585;
      --line: #e9e8e5;
      --soft-line: #f0efed;
      --hover: #f5f4f2;
      --active: #efeeeb;
      --black: #202020;
      --shadow: 0 24px 70px rgba(0, 0, 0, 0.08);
      --radius-xl: 28px;
      --radius-lg: 18px;
      --radius-md: 14px;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 28px;
      background:
        radial-gradient(circle at top left, rgba(255,255,255,.9), transparent 36%),
        var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text",
        "PingFang SC", "Microsoft YaHei", "Segoe UI", sans-serif;
      user-select: none;
    }

    .app-window {
      width: min(1180px, 100%);
      height: min(760px, calc(100vh - 56px));
      min-height: 680px;
      overflow: hidden;
      background: var(--window);
      border: 1px solid var(--line);
      border-radius: var(--radius-xl);
      box-shadow: var(--shadow);
      display: grid;
      grid-template-rows: 132px 1fr;
    }

    .connect-panel[hidden] {
      display: none;
    }

    .topbar {
      display: grid;
      grid-template-columns: 260px 1fr 160px;
      align-items: center;
      gap: 24px;
      padding: 0 46px;
      border-bottom: 1px solid var(--line);
      background: rgba(255, 255, 255, 0.82);
      backdrop-filter: blur(16px);
    }

    .page-title {
      font-size: 24px;
      font-weight: 760;
      letter-spacing: -0.03em;
    }

    .user-card {
      justify-self: center;
      display: flex;
      align-items: center;
      gap: 16px;
      min-width: 360px;
    }

    .avatar {
      width: 58px;
      height: 58px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      background: #f6efe6;
      border: 1px solid #ece5db;
      box-shadow: inset 0 1px 0 rgba(255,255,255,.8);
      flex-shrink: 0;
    }

    .avatar svg {
      width: 38px;
      height: 38px;
      color: #202020;
    }

    .user-name {
      font-size: 18px;
      font-weight: 720;
      letter-spacing: -0.02em;
      line-height: 1.2;
    }

    .user-id {
      margin-top: 5px;
      color: var(--muted);
      font-size: 13px;
    }

    .connect-gp-id,
    .connect-invite-code,
    .member-name {
      user-select: text;
    }

    .copy-id {
      justify-self: end;
      height: 44px;
      padding: 0 18px;
      display: inline-flex;
      align-items: center;
      gap: 10px;
      border: 1px solid var(--line);
      border-radius: var(--radius-md);
      background: #fff;
      color: #333;
      font-size: 14px;
      font-weight: 620;
      cursor: pointer;
      transition: .18s ease;
    }

    .copy-id:hover {
      background: var(--hover);
      transform: translateY(-1px);
    }

    .layout {
      min-height: 0;
      display: grid;
      grid-template-columns: 360px 1fr;
    }

    .sidebar {
      min-height: 0;
      display: flex;
      flex-direction: column;
      padding: 32px 32px;
      border-right: 1px solid var(--line);
      background: linear-gradient(180deg, #fff 0%, #fbfbfa 100%);
    }

    .sidebar-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 28px;
    }

    .sidebar-title {
      font-size: 19px;
      font-weight: 740;
      letter-spacing: -0.02em;
    }

    .icon-btn {
      width: 38px;
      height: 38px;
      border: none;
      border-radius: 12px;
      background: transparent;
      color: #222;
      font-size: 28px;
      line-height: 1;
      cursor: pointer;
      transition: .18s ease;
    }

    .icon-btn:hover {
      background: var(--hover);
    }

    .room-list {
      flex: 1 1 auto;
      min-height: 0;
      display: flex;
      flex-direction: column;
      gap: 8px;
      overflow-y: auto;
      padding-right: 2px;
    }

    .room-item {
      min-height: 58px;
      height: 58px;
      padding: 0 16px;
      display: flex;
      align-items: center;
      gap: 14px;
      border: 0;
      border-radius: var(--radius-lg);
      background: transparent;
      color: #222;
      cursor: pointer;
      transition: .18s ease;
      user-select: none;
      text-align: left;
    }

    .room-item:hover {
      background: var(--hover);
    }

    .room-item.active {
      background: var(--active);
    }

    .room-icon {
      width: 24px;
      height: 24px;
      color: #222;
      opacity: .9;
      flex-shrink: 0;
    }

    .room-text {
      flex: 1;
      min-width: 0;
      font-size: 17px;
      font-weight: 630;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .room-meta {
      color: var(--muted);
      font-size: 12px;
    }

    .invite-list {
      flex: 0 0 auto;
      max-height: 132px;
      margin-top: 14px;
      padding-top: 14px;
      border-top: 1px solid var(--line);
      display: flex;
      flex-direction: column;
      gap: 8px;
      overflow-y: auto;
    }

    .invite-item {
      padding: 12px 14px;
      border: 1px dashed #deddda;
      border-radius: var(--radius-lg);
      background: #fff;
    }

    .invite-title {
      font-size: 14px;
      font-weight: 680;
    }

    .invite-meta {
      margin-top: 5px;
      color: var(--muted);
      font-size: 12px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .invite-actions {
      display: flex;
      gap: 10px;
      margin-top: 12px;
    }

    .small-btn {
      height: 28px;
      padding: 0 12px;
      border: 1px solid #deddda;
      border-radius: 10px;
      background: #fff;
      color: #222;
      font-size: 12px;
      font-weight: 650;
      cursor: pointer;
    }

    .small-btn.primary {
      border-color: var(--black);
      background: var(--black);
      color: #fff;
    }

    .sidebar-actions {
      flex: 0 0 auto;
      margin-top: 18px;
      display: grid;
      gap: 12px;
    }

    button {
      font-family: inherit;
    }

    .btn {
      height: 48px;
      border-radius: var(--radius-md);
      font-size: 15px;
      font-weight: 680;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: .18s ease;
    }

    .btn-primary {
      border: none;
      background: var(--black);
      color: white;
      box-shadow: 0 12px 26px rgba(0,0,0,.14);
    }

    .btn-primary:hover {
      background: #111;
      transform: translateY(-1px);
    }

    .btn-secondary {
      border: 1px solid #deddda;
      background: white;
      color: #222;
    }

    .btn-secondary:hover {
      background: var(--hover);
      transform: translateY(-1px);
    }

    .main {
      min-height: 0;
      padding: 40px 40px 34px;
      display: flex;
      flex-direction: column;
      background: #fff;
    }

    .section {
      max-width: 720px;
    }

    .section-title {
      margin: 0;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--line);
      font-size: 19px;
      font-weight: 750;
      letter-spacing: -0.02em;
    }

    .member-section {
      min-height: 0;
      display: flex;
      flex: 1 1 auto;
      flex-direction: column;
    }

    .members {
      min-height: 0;
      padding: 18px 0 16px;
      display: grid;
      gap: 12px;
      overflow-y: auto;
    }

    .member {
      display: grid;
      grid-template-columns: 44px minmax(0, auto) auto 1fr;
      align-items: center;
      gap: 12px;
    }

    .member-avatar {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      font-size: 20px;
      background: #f1f1ef;
      border: 1px solid var(--soft-line);
    }

    .member-name {
      min-width: 0;
      font-size: 16px;
      font-weight: 640;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .badge {
      padding: 6px 14px;
      border-radius: 999px;
      background: #f3f2f0;
      color: #666;
      font-size: 12px;
      font-weight: 560;
    }

    .description {
      padding: 18px 0 0;
      color: #747474;
      font-size: 15px;
      line-height: 1.85;
      max-width: 780px;
    }

    .actions {
      flex: 0 0 auto;
      margin-top: auto;
      display: grid;
      grid-template-columns: 180px 180px 180px;
      gap: 14px;
      max-width: 760px;
    }

    .actions .btn {
      height: 48px;
      font-size: 15px;
    }

    .svg-icon {
      width: 20px;
      height: 20px;
      flex-shrink: 0;
    }

    .room-detail[hidden],
    .empty-state[hidden] {
      display: none;
    }

    .room-detail {
      min-height: 0;
      height: 100%;
      display: flex;
      flex-direction: column;
    }

    .empty-state {
      margin: auto;
      color: var(--muted);
      font-size: 16px;
    }

    .connect-message {
      flex: 0 0 auto;
      min-height: 24px;
      margin: 18px 0 0;
      color: var(--muted);
      font-size: 13px;
    }

    .connect-message.is-error {
      color: #b75c67;
    }

    .modal-backdrop {
      position: fixed;
      inset: 0;
      z-index: 20;
      display: grid;
      place-items: center;
      background: rgba(31, 31, 31, 0.2);
    }

    .modal-backdrop[hidden] {
      display: none;
    }

    .connect-modal {
      width: min(390px, calc(100vw - 56px));
      padding: 28px;
      border: 1px solid var(--line);
      border-radius: 22px;
      background: #fff;
      box-shadow: 0 22px 56px rgba(0, 0, 0, 0.14);
    }

    .modal-title {
      margin: 0 0 18px;
      font-size: 18px;
      font-weight: 760;
    }

    .connect-input {
      width: 100%;
      height: 42px;
      padding: 0 14px;
      border: 1px solid #deddda;
      border-radius: 12px;
      outline: none;
      color: var(--text);
      font-size: 14px;
    }

    .connect-input:focus {
      border-color: #202020;
    }

    .connect-form-message {
      min-height: 20px;
      margin: 10px 0 18px;
      color: #b75c67;
      font-size: 12px;
    }

    .connect-form-actions {
      display: flex;
      justify-content: flex-end;
      gap: 12px;
    }

    @media (max-width: 900px) {
      body {
        padding: 0;
        align-items: stretch;
      }

      .app-window {
        height: 100vh;
        min-height: 100vh;
        border-radius: 0;
      }

      .topbar {
        grid-template-columns: 1fr auto;
        padding: 0 24px;
      }

      .page-title {
        font-size: 24px;
      }

      .user-card {
        display: none;
      }

      .layout {
        grid-template-columns: 280px 1fr;
      }

      .sidebar {
        padding: 30px 22px;
      }

      .actions {
        grid-template-columns: 1fr;
      }
    }

    @media (max-width: 680px) {
      .app-window {
        grid-template-rows: auto 1fr;
      }

      .topbar {
        height: auto;
        padding: 22px;
        grid-template-columns: 1fr;
        gap: 16px;
      }

      .copy-id {
        justify-self: start;
        height: 46px;
      }

      .layout {
        grid-template-columns: 1fr;
        overflow: auto;
      }

      .sidebar {
        border-right: none;
        border-bottom: 1px solid var(--line);
      }

      .main {
        padding: 34px 24px;
      }

      .actions {
        max-width: none;
      }
    }
  </style>
</head>

<body>
  <main class="app-window connect-panel">
    <header class="topbar">
      <div class="page-title"> </div>

      <div class="user-card">
        <div class="avatar" aria-hidden="true">
          <svg viewBox="0 0 64 64" fill="none">
            <path d="M18 47V31C18 20 26 13 37 13C48 13 55 21 55 32C55 41 49 47 39 47H31" stroke="currentColor" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M18 31C12 33 9 38 9 47" stroke="currentColor" stroke-width="5" stroke-linecap="round"/>
            <path d="M38 47V54" stroke="currentColor" stroke-width="5" stroke-linecap="round"/>
            <circle cx="43" cy="28" r="3" fill="currentColor"/>
          </svg>
        </div>
        <div>
          <div class="user-name connect-display-name">GoodPuppy</div>
          <div class="user-id">ID: <span class="connect-gp-id"></span></div>
        </div>
      </div>

      <button class="copy-id connect-copy-btn" type="button" data-copy="gp-id">
        <svg class="svg-icon" viewBox="0 0 24 24" fill="none">
          <rect x="9" y="9" width="10" height="10" rx="2" stroke="currentColor" stroke-width="2"/>
          <rect x="5" y="5" width="10" height="10" rx="2" stroke="currentColor" stroke-width="2"/>
        </svg>
        复制
      </button>
    </header>

    <section class="layout">
      <aside class="sidebar">
        <div class="sidebar-head">
          <div class="sidebar-title">我的房间</div>
        </div>

        <div class="room-list connect-room-list"></div>
        <div class="invite-list connect-request-list"></div>

        <div class="sidebar-actions">
          <button class="btn btn-primary connect-create-room" type="button">＋ 创建房间</button>
          <button class="btn btn-secondary connect-join-room" type="button">＋ 加入房间</button>
        </div>
      </aside>

      <section class="main">
        <div class="empty-state connect-empty-detail">选择一个房间查看成员</div>

        <section class="room-detail connect-room-detail" hidden>
          <span class="connect-invite-code" hidden></span>

          <section class="section member-section">
            <h2 class="section-title">房间成员</h2>
            <div class="members connect-member-list"></div>
          </section>

          <section class="section">
            <h2 class="section-title">房间简介</h2>
            <p class="description">
              这是一个温馨的小房间，欢迎朋友们加入一起陪伴彼此的桌面时光。
              在这里，大家可以把自己的桌面形象放到同一个房间中，保持一种轻松、自然的在线陪伴感。
            </p>
          </section>

          <p class="connect-message" role="status"></p>

          <div class="actions">
            <button class="btn btn-primary connect-enter-room" type="button">
              <svg class="svg-icon" viewBox="0 0 24 24" fill="none">
                <path d="M10 17l5-5-5-5" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
                <path d="M15 12H3" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/>
                <path d="M13 4h5a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2h-5" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/>
              </svg>
              进入房间
            </button>

            <button class="btn btn-secondary connect-copy-btn" type="button" data-copy="invite-code">
              <svg class="svg-icon" viewBox="0 0 24 24" fill="none">
                <path d="M10.5 13.5 13.5 10.5" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/>
                <path d="M8.8 16.9 7.6 18.1a4 4 0 0 1-5.7-5.7l3.2-3.2a4 4 0 0 1 5.7 0" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/>
                <path d="M15.2 7.1 16.4 5.9a4 4 0 0 1 5.7 5.7l-3.2 3.2a4 4 0 0 1-5.7 0" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/>
              </svg>
              复制邀请码
            </button>

            <button class="btn btn-secondary connect-invite-member" type="button">
              <svg class="svg-icon" viewBox="0 0 24 24" fill="none">
                <path d="M15 19a6 6 0 0 0-12 0" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/>
                <circle cx="9" cy="8" r="4" stroke="currentColor" stroke-width="2.2"/>
                <path d="M19 8v6" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/>
                <path d="M16 11h6" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/>
              </svg>
              邀请成员
            </button>
          </div>
        </section>
      </section>
    </section>
  </main>

  <div class="modal-backdrop connect-modal-backdrop" hidden>
    <form class="connect-modal">
      <h2 class="modal-title connect-modal-title"></h2>
      <input class="connect-input" name="modal-value" autocomplete="off" />
      <p class="connect-form-message" role="status"></p>
      <div class="connect-form-actions">
        <button class="small-btn connect-form-cancel" type="button">取消</button>
        <button class="small-btn primary connect-form-submit" type="submit">确定</button>
      </div>
    </form>
  </div>

  <script type="module" src="/src/connect-main.js"></script>
</body>
</html>
