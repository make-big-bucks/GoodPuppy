<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Good Puppy</title>
  </head>
  <body>
    <section class="auth-panel" aria-label="Good Puppy login">
      <form class="auth-card">
        <h1>GoodPuppy</h1>
        <input class="auth-input" name="email" type="email" autocomplete="email" placeholder="邮箱" required />
        <label class="auth-password-field">
          <input
            class="auth-input auth-password"
            name="password"
            type="password"
            autocomplete="current-password"
            placeholder="密码"
            minlength="6"
            required
          />
          <button class="auth-password-toggle" type="button" aria-label="显示密码">显示</button>
        </label>
        <p class="auth-message" role="status"></p>
        <div class="auth-actions">
          <button class="auth-button auth-login" type="submit">登录</button>
          <button class="auth-button auth-register" type="button">注册</button>
        </div>
      </form>
    </section>

    <main class="pet-stage is-initializing" aria-label="Good Puppy desktop pet">
      <section class="dog-area left-dog" data-user="user_a" aria-label="Left puppy">
        <div class="message-bubble left-bubble" role="status" aria-live="polite" data-user="user_a" hidden>
          <span class="message-alert" aria-hidden="true">!</span>
          <div class="bubble-content">
            <div class="bubble-text"></div>
            <div class="bubble-nav" aria-label="Message navigation">
              <button class="bubble-nav-button bubble-prev" type="button" aria-label="Previous message">&lt;</button>
              <button class="bubble-nav-button bubble-next" type="button" aria-label="Next message">&gt;</button>
              <button class="bubble-nav-button bubble-compose" type="button" aria-label="Write message">+</button>
            </div>
          </div>
          <form class="bubble-composer" hidden>
            <textarea class="bubble-input" aria-label="Message text" rows="1"></textarea>
            <div class="bubble-status" role="status"></div>
            <div class="bubble-actions">
              <button class="bubble-button bubble-cancel" type="button" aria-label="Cancel">&times;</button>
              <button class="bubble-button bubble-send" type="submit" aria-label="Send">&#10003;</button>
            </div>
          </form>
        </div>
        <img class="pet-image left-pet" data-user="user_a" src="/state_images/state_06.gif" alt="Left puppy" draggable="false" />
      </section>

      <section class="dog-area right-dog" data-user="user_b" aria-label="Right puppy">
        <div class="message-bubble right-bubble" role="status" aria-live="polite" data-user="user_b" hidden>
          <span class="message-alert" aria-hidden="true">!</span>
          <div class="bubble-content">
            <div class="bubble-text"></div>
            <div class="bubble-nav" aria-label="Message navigation">
              <button class="bubble-nav-button bubble-prev" type="button" aria-label="Previous message">&lt;</button>
              <button class="bubble-nav-button bubble-next" type="button" aria-label="Next message">&gt;</button>
              <button class="bubble-nav-button bubble-compose" type="button" aria-label="Write message">+</button>
            </div>
          </div>
          <form class="bubble-composer" hidden>
            <textarea class="bubble-input" aria-label="Message text" rows="1"></textarea>
            <div class="bubble-status" role="status"></div>
            <div class="bubble-actions">
              <button class="bubble-button bubble-cancel" type="button" aria-label="Cancel">&times;</button>
              <button class="bubble-button bubble-send" type="submit" aria-label="Send">&#10003;</button>
            </div>
          </form>
        </div>
        <img class="pet-image right-pet is-flipped" data-user="user_b" src="/state_images/state_06.gif" alt="Right puppy" draggable="false" />
      </section>
    </main>
    <!-- Connect panel (tray menu → 连接管理) -->
    <section class="connect-panel" hidden aria-label="连接管理">
      <!-- Main view -->
      <div class="connect-main">
        <div class="connect-header">
          <h2 class="connect-title">连接管理</h2>
          <button class="connect-close" type="button" aria-label="关闭">✕</button>
        </div>

        <!-- My profile -->
        <div class="connect-profile">
          <div class="connect-profile-name-row">
            <span class="connect-label">显示名</span>
            <span class="connect-display-name"></span>
          </div>
          <div class="connect-profile-id-row">
            <span class="connect-label">我的 ID</span>
            <span class="connect-gp-id"></span>
            <button class="connect-copy-btn" type="button" data-copy="gp-id">复制</button>
          </div>
        </div>

        <!-- Pending requests (hidden when none) -->
        <div class="connect-requests" hidden>
          <div class="connect-section-title">待处理请求</div>
          <ul class="connect-request-list"></ul>
        </div>

        <!-- Room list -->
        <div class="connect-section-title">我的房间</div>
        <ul class="connect-room-list">
          <li class="connect-empty-hint">还没有房间</li>
        </ul>

        <!-- Action buttons -->
        <div class="connect-actions">
          <button class="connect-action-btn" type="button" data-action="id">按 ID 连接</button>
          <button class="connect-action-btn" type="button" data-action="code">输入邀请码</button>
        </div>

        <!-- Inline form: connect by GoodPuppy ID -->
        <form class="connect-form connect-form-id" hidden>
          <input class="connect-input" name="gp-id" placeholder="对方的 GoodPuppy ID" autocomplete="off" />
          <p class="connect-form-message" role="status"></p>
          <div class="connect-form-actions">
            <button type="button" class="connect-form-cancel">取消</button>
            <button type="submit" class="connect-form-submit">发送请求</button>
          </div>
        </form>

        <!-- Inline form: join by invite code -->
        <form class="connect-form connect-form-code" hidden>
          <input class="connect-input" name="invite-code" placeholder="房间邀请码" autocomplete="off" />
          <p class="connect-form-message" role="status"></p>
          <div class="connect-form-actions">
            <button type="button" class="connect-form-cancel">取消</button>
            <button type="submit" class="connect-form-submit">加入房间</button>
          </div>
        </form>

        <p class="connect-message" role="status"></p>
      </div>

      <!-- Room detail view -->
      <div class="connect-room-detail" hidden>
        <div class="connect-header">
          <button class="connect-back" type="button">← 返回</button>
          <button class="connect-close" type="button" aria-label="关闭">✕</button>
        </div>

        <div class="connect-section-title">房间成员</div>
        <ul class="connect-member-list"></ul>

        <div class="connect-section-title">邀请码</div>
        <div class="connect-invite-row">
          <span class="connect-invite-code"></span>
          <button class="connect-copy-btn" type="button" data-copy="invite-code">复制</button>
        </div>

        <button class="connect-enter-room" type="button">进入此房间</button>

        <p class="connect-message" role="status"></p>
      </div>
    </section>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
