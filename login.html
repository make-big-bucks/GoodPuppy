<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GoodPuppy 登录</title>
    <link rel="stylesheet" href="./src/windows/login/login.css" />
  </head>
  <body class="login-page">
    <section class="auth-panel" aria-label="GoodPuppy 登录">
      <main class="login-window">
        <section class="brand">
          <div class="logo" aria-hidden="true">
            <svg viewBox="0 0 64 64" fill="none">
              <path
                d="M18 47V31C18 20 26 13 37 13C48 13 55 21 55 32C55 41 49 47 39 47H31"
                stroke="currentColor"
                stroke-width="5"
                stroke-linecap="round"
                stroke-linejoin="round"
              />
              <path d="M18 31C12 33 9 38 9 47" stroke="currentColor" stroke-width="5" stroke-linecap="round" />
              <path d="M38 47V54" stroke="currentColor" stroke-width="5" stroke-linecap="round" />
              <circle cx="43" cy="28" r="3" fill="currentColor" />
            </svg>
          </div>
          <h1>GoodPuppy</h1>
          <p class="subtitle">和朋友一起出现在彼此的桌面上</p>
        </section>

        <form class="auth-card">
          <div class="form-group">
            <label for="email">账号</label>
            <div class="input-box">
              <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
                <path d="M20 21a8 8 0 0 0-16 0" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
                <circle cx="12" cy="7" r="4" stroke="currentColor" stroke-width="2" />
              </svg>
              <input
                id="email"
                class="auth-input"
                name="email"
                type="email"
                autocomplete="email"
                placeholder="邮箱 / 账号"
                required
              />
            </div>
          </div>

          <div class="form-group">
            <label for="password">密码</label>
            <div class="input-box auth-password-field">
              <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
                <rect x="5" y="10" width="14" height="10" rx="2" stroke="currentColor" stroke-width="2" />
                <path d="M8 10V7a4 4 0 0 1 8 0v3" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
              </svg>
              <input
                id="password"
                class="auth-input auth-password"
                name="password"
                type="password"
                autocomplete="current-password"
                placeholder="输入密码"
                minlength="6"
                required
              />
              <button class="auth-password-toggle" type="button" aria-label="显示密码">显示</button>
            </div>
          </div>

          <div class="row">
            <label class="remember">
              <input class="remember-me" name="remember_me" type="checkbox" />
              记住我
            </label>
            <a class="link" href="#">忘记密码？</a>
          </div>

          <p class="auth-message" role="status"></p>

          <div class="auth-actions">
            <button class="auth-button auth-login primary-btn" type="submit">上线</button>
          </div>

          <div class="divider">或</div>

          <button class="auth-button auth-register secondary-btn" type="button">创建新账号</button>
        </form>
      </main>
    </section>
    <script type="module" src="/src/windows/login/login-main.js"></script>
  </body>
</html>
