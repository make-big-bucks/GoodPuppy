<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GoodPuppy 登录</title>
    <style>
      * {
        box-sizing: border-box;
      }

      body.login-page {
        margin: 0;
        min-height: 100vh;
        background: #f4f4f2;
        color: #222;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      }

      .login-page .auth-panel {
        width: 100vw;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 16px;
        background: #f4f4f2;
      }

      .login-page .login-window {
        width: 380px;
        min-height: 600px;
        padding: 42px 36px 32px;
        background: #fff;
        border: 1px solid #e6e6e3;
        border-radius: 24px;
        box-shadow:
          0 24px 60px rgba(0, 0, 0, 0.08),
          inset 0 1px 0 rgba(255, 255, 255, 0.8);
      }

      .login-page .brand {
        margin-bottom: 34px;
        text-align: center;
      }

      .login-page .logo {
        width: 72px;
        height: 72px;
        margin: 0 auto 16px;
        border: 1px solid #eeeeeb;
        border-radius: 22px;
        background: #fff;
        box-shadow: 0 10px 28px rgba(0, 0, 0, 0.06);
        color: #222;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .login-page .logo svg {
        width: 42px;
        height: 42px;
      }

      .login-page h1 {
        margin: 0;
        font-size: 34px;
        font-weight: 700;
        letter-spacing: 0;
        line-height: 1.15;
      }

      .login-page .subtitle {
        margin: 8px 0 0;
        color: #8b8b8b;
        font-size: 14px;
      }

      .login-page .auth-card {
        width: 100%;
        padding: 0;
        border: 0;
        background: transparent;
        box-shadow: none;
      }

      .login-page .form-group {
        margin-bottom: 16px;
      }

      .login-page label {
        display: block;
        margin-bottom: 8px;
        font-size: 14px;
        font-weight: 600;
      }

      .login-page .input-box {
        height: 48px;
        padding: 0 14px;
        border: 1px solid #dcdcdc;
        border-radius: 12px;
        background: #fff;
        display: flex;
        align-items: center;
        gap: 10px;
        transition:
          border-color 0.2s ease,
          box-shadow 0.2s ease;
      }

      .login-page .input-box:focus-within {
        border-color: #222;
        box-shadow: 0 0 0 4px rgba(0, 0, 0, 0.05);
      }

      .login-page .input-box svg {
        width: 20px;
        height: 20px;
        color: #999;
        flex-shrink: 0;
      }

      .login-page .auth-input {
        width: 100%;
        min-width: 0;
        height: 100%;
        margin: 0;
        padding: 0;
        border: 0;
        outline: 0;
        background: transparent;
        color: #222;
        font-size: 14px;
      }

      .login-page .auth-input::placeholder {
        color: #aaa;
      }

      .login-page .auth-password-field {
        position: relative;
      }

      .login-page .auth-password-toggle {
        flex-shrink: 0;
        height: 26px;
        padding: 0 6px;
        border: 0;
        border-radius: 8px;
        background: transparent;
        color: #777;
        cursor: pointer;
        font: inherit;
        font-size: 13px;
      }

      .login-page .row {
        margin: 2px 0 14px;
        color: #666;
        display: flex;
        align-items: center;
        justify-content: space-between;
        font-size: 13px;
      }

      .login-page .remember {
        margin: 0;
        display: flex;
        align-items: center;
        gap: 6px;
        font-size: 13px;
        font-weight: 400;
      }

      .login-page .remember input {
        width: 16px;
        height: 16px;
        accent-color: #222;
      }

      .login-page .link {
        color: #555;
        text-decoration: none;
      }

      .login-page .link:hover {
        color: #111;
      }

      .login-page .auth-message {
        min-height: 18px;
        margin: 0 0 6px;
        color: #9a4d4d;
        font-size: 13px;
        line-height: 1.4;
        text-align: center;
      }

      .login-page .auth-actions {
        display: block;
      }

      .login-page .auth-button {
        cursor: pointer;
        font-family: inherit;
        transition:
          background 0.2s ease,
          transform 0.2s ease;
      }

      .login-page .auth-button:disabled {
        cursor: default;
        opacity: 0.6;
        transform: none;
      }

      .login-page .primary-btn {
        width: 100%;
        height: 48px;
        border: 0;
        border-radius: 12px;
        background: #222;
        color: #fff;
        box-shadow: 0 10px 24px rgba(0, 0, 0, 0.18);
        font-size: 16px;
        font-weight: 600;
      }

      .login-page .primary-btn:hover:not(:disabled) {
        background: #111;
        transform: translateY(-1px);
      }

      .login-page .divider {
        margin: 20px 0;
        color: #aaa;
        display: flex;
        align-items: center;
        gap: 18px;
        font-size: 14px;
      }

      .login-page .divider::before,
      .login-page .divider::after {
        content: "";
        height: 1px;
        flex: 1;
        background: #e5e5e5;
      }

      .login-page .secondary-btn {
        width: 100%;
        height: 46px;
        border: 1px solid #ddd;
        border-radius: 12px;
        background: #fff;
        color: #222;
        font-size: 15px;
        font-weight: 600;
      }

      .login-page .secondary-btn:hover:not(:disabled) {
        background: #f7f7f7;
      }

      @media (max-width: 480px) {
        body.login-page,
        .login-page .auth-panel {
          background: #fff;
        }

        .login-page .auth-panel {
          padding: 0;
        }

        .login-page .login-window {
          width: 100%;
          min-height: 100vh;
          padding: 42px 28px 32px;
          border: 0;
          border-radius: 0;
          box-shadow: none;
        }
      }
    </style>
  </head>
  <body class="login-page">
    <section class="auth-panel" aria-label="GoodPuppy 登录">
      <main class="login-window">
        <section class="brand">
          <div class="logo" aria-hidden="true">
            <svg viewBox="0 0 64 64" fill="none">
              <path
                d="M18 47V31C18 20 26 13 37 13C48 13 55 21 55 32C55 41 49 47 39 47H31"
                stroke="currentColor"
                stroke-width="5"
                stroke-linecap="round"
                stroke-linejoin="round"
              />
              <path d="M18 31C12 33 9 38 9 47" stroke="currentColor" stroke-width="5" stroke-linecap="round" />
              <path d="M38 47V54" stroke="currentColor" stroke-width="5" stroke-linecap="round" />
              <circle cx="43" cy="28" r="3" fill="currentColor" />
            </svg>
          </div>
          <h1>GoodPuppy</h1>
          <p class="subtitle">和朋友一起出现在彼此的桌面上</p>
        </section>

        <form class="auth-card">
          <div class="form-group">
            <label for="email">账号</label>
            <div class="input-box">
              <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
                <path d="M20 21a8 8 0 0 0-16 0" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
                <circle cx="12" cy="7" r="4" stroke="currentColor" stroke-width="2" />
              </svg>
              <input
                id="email"
                class="auth-input"
                name="email"
                type="email"
                autocomplete="email"
                placeholder="邮箱 / 账号"
                required
              />
            </div>
          </div>

          <div class="form-group">
            <label for="password">密码</label>
            <div class="input-box auth-password-field">
              <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
                <rect x="5" y="10" width="14" height="10" rx="2" stroke="currentColor" stroke-width="2" />
                <path d="M8 10V7a4 4 0 0 1 8 0v3" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
              </svg>
              <input
                id="password"
                class="auth-input auth-password"
                name="password"
                type="password"
                autocomplete="current-password"
                placeholder="输入密码"
                minlength="6"
                required
              />
              <button class="auth-password-toggle" type="button" aria-label="显示密码">显示</button>
            </div>
          </div>

          <div class="row">
            <label class="remember">
              <input class="remember-me" name="remember_me" type="checkbox" />
              记住我
            </label>
            <a class="link" href="#">忘记密码？</a>
          </div>

          <p class="auth-message" role="status"></p>

          <div class="auth-actions">
            <button class="auth-button auth-login primary-btn" type="submit">上线</button>
          </div>

          <div class="divider">或</div>

          <button class="auth-button auth-register secondary-btn" type="button">创建新账号</button>
        </form>
      </main>
    </section>
    <script type="module" src="/src/login-main.js"></script>
  </body>
</html>
