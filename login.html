<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GoodPuppy</title>
  </head>
  <body>
    <section class="auth-panel" aria-label="GoodPuppy 登录">
      <form class="auth-card">
        <h1>GoodPuppy</h1>
        <input class="auth-input" name="email" type="email" autocomplete="email" placeholder="邮箱" required />
        <label class="auth-password-field">
          <input
            class="auth-input auth-password"
            name="password"
            type="password"
            autocomplete="current-password"
            placeholder="密码"
            minlength="6"
            required
          />
          <button class="auth-password-toggle" type="button" aria-label="显示密码">显示</button>
        </label>
        <p class="auth-message" role="status"></p>
        <div class="auth-actions">
          <button class="auth-button auth-login" type="submit">登录</button>
          <button class="auth-button auth-register" type="button">注册</button>
        </div>
      </form>
    </section>
    <script type="module" src="/src/login-main.js"></script>
  </body>
</html>
